name: Email vs ClickUp daily check

on:
  schedule:
    # 05:52 UTC = 07:52 in Maputo, Monday to Friday.
    # Monday's run reviews Friday to Sunday.
    - cron: "52 5 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Last day to review (YYYY-MM-DD). Empty = previous working day."
        required: false
      days:
        description: "Number of days to review, ending on that date."
        required: false
      no_email:
        description: "Dry run: do not send any email."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: email-clickup-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: email-clickup-crosscheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: email-clickup-crosscheck/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Run cross-check
        env:
          CROSSCHECK_CONFIG: ${{ secrets.CROSSCHECK_CONFIG }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_NO_EMAIL: ${{ inputs.no_email }}
        # The report is only emailed. It is never uploaded as an artifact,
        # because artifacts and logs of a public repository are public.
        run: |
          ARGS=()
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          if [ -n "$INPUT_DAYS" ]; then ARGS+=(--days "$INPUT_DAYS"); fi
          if [ "$INPUT_NO_EMAIL" = "true" ]; then ARGS+=(--no-email); fi
          python -m crosscheck run "${ARGS[@]}"

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: email-clickup-crosscheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
