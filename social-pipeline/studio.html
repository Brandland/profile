<title>Playground Social Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: production board -> job workspace (inputs | agents) -> bilingual post proofs */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --sunk:#E7EBE7; --ink:#15211F; --muted:#5A6764; --line:#D4DAD5;
  --accent:#0D6B5B; --accent-ink:#FFFFFF; --accent-soft:#D6EBE4;
  --ok:#2E7A3A; --ok-soft:#DCEFDD; --warn:#9A5B0C; --warn-soft:#F5E6CC; --bad:#B23C2B; --bad-soft:#F6DCD7;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#16201E; --sunk:#1D2927; --ink:#E4EBE8; --muted:#94A39F; --line:#2A3835;
  --accent:#53C2A8; --accent-ink:#062019; --accent-soft:#173A33;
  --ok:#7FCB8A; --ok-soft:#1D3522; --warn:#E3AE5E; --warn-soft:#3A2C14; --bad:#F08A78; --bad-soft:#3D1F1A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#16201E; --sunk:#1D2927; --ink:#E4EBE8; --muted:#94A39F; --line:#2A3835;
  --accent:#53C2A8; --accent-ink:#062019; --accent-soft:#173A33;
  --ok:#7FCB8A; --ok-soft:#1D3522; --warn:#E3AE5E; --warn-soft:#3A2C14; --bad:#F08A78; --bad-soft:#3D1F1A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.grow{flex:1}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums} .small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:500 13px/1 var(--f-body);border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
button.danger{color:var(--bad)}
button.danger.primary{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm,.btn.sm{padding:6px 9px;font-size:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],textarea,select{font:400 14px/1.45 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--f-mono);letter-spacing:.03em;padding:5px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:10px 14px;border-radius:8px;margin-top:16px}
.note{border-radius:6px;padding:8px 10px;font-size:12px;background:var(--warn-soft)}
.page-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-block:24px 18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:8px 12px;background:transparent;font-family:var(--f-mono);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;font-size:14px;line-height:1.3}
.empty{color:var(--muted);font-size:13px;padding:10px 6px}
/* job */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.pipe .step{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.pipe .step:last-child{border-right:0}
.pipe .step .n{font:500 11px var(--f-mono);color:var(--muted)}
.pipe .step .d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pipe .step.running{background:var(--accent-soft)} .pipe .step.done .n{color:var(--ok)} .pipe .step.error .n{color:var(--bad)}
.jgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
@media (max-width:980px){.jgrid{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe .step:nth-child(2){border-right:0}.pipe .step:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.file{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk);font-size:11px;display:flex;flex-direction:column;min-width:0;position:relative}
.file .th{aspect-ratio:1;display:grid;place-items:center;background:var(--sunk);overflow:hidden;font:600 12px var(--f-mono);color:var(--muted)}
.file .th img{width:100%;height:100%;object-fit:cover}
.file .nm{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
.file .role{position:absolute;top:4px;left:4px;font:500 10px/1 var(--f-mono);padding:4px 6px;border-radius:99px;border:0;background:rgba(0,0,0,.66);color:#fff;cursor:pointer}
.file .role.post{background:rgba(13,107,91,.92)}
.file > button.rm{border:0;border-top:1px solid var(--line);border-radius:0;font-size:11px;padding:5px;background:var(--surface);color:var(--muted)}
.agent{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.agent:first-of-type{border-top:0;padding-top:0}
.agent-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{font:12px/1.5 var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 10px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
.out{font-size:13px;display:flex;flex-direction:column;gap:6px}
.out ul{margin:0;padding-left:18px}
details summary{cursor:pointer;font-weight:600;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px} .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dir{display:flex;flex-direction:column;gap:10px}
.dir .idea{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.25;margin:0}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.pal span{display:flex;flex-direction:column;gap:3px;font:10px/1.2 var(--f-mono);color:var(--muted);width:74px}
.pal i{display:block;height:34px;border-radius:5px;border:1px solid var(--line)}
.types{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.types span{font-size:22px;line-height:1.1}
.types small{display:block;font:11px var(--f-mono);color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ref{display:flex;gap:8px;align-items:flex-start;font-size:12px;background:var(--sunk);border-radius:6px;padding:6px;min-width:0}
.ref img{width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none}
/* posts */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.post.approved{border-color:var(--ok)} .post.changes{border-color:var(--warn)}
.post .cv{background:var(--sunk);display:flex;justify-content:center;padding:12px;position:relative}
.post canvas{max-width:100%;max-height:480px;height:auto;width:auto;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.post .badge{position:absolute;top:18px;left:18px}
.post .body{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.caption{white-space:pre-wrap;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.tags{color:var(--accent);font-size:12px;overflow-wrap:anywhere}
.qa{border-radius:6px;padding:8px 10px;font-size:12px}
.qa.good{background:var(--ok-soft)} .qa.mid{background:var(--warn-soft)} .qa.low{background:var(--bad-soft)}
.qa ul{margin:4px 0 0;padding-left:16px}
.post .foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.swatches{display:flex;gap:4px} .sw{width:18px;height:18px;border-radius:4px;border:1px solid var(--line)}
.fontrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto auto;gap:8px;align-items:end}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <button class="brand" id="home">Playground Social Studio<small>brief to post</small></button>
  <span class="grow"></span>
  <button id="nav-clients">Clients</button>
  <button class="primary" id="nav-new">New job</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ================= constants =================
const CDN={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",pdfWorker:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",zip:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"};
const PLATFORMS=["Instagram","Facebook","LinkedIn","TikTok","X"];
const FORMATS={feed:{w:1080,h:1080,label:"Feed 1:1",canva:"SQUARE_1_1"},portrait:{w:1080,h:1350,label:"Portrait 4:5",canva:"PORTRAIT_4_5"},story:{w:1080,h:1920,label:"Story 9:16",canva:"PORTRAIT_9_16"}};
const LANG_OPTS={both:"Português (Moçambique) + English (South Africa)",pt:"Português (Moçambique) only",en:"English (South Africa) only"};
const LANG_TAG={pt:"PT-MZ",en:"EN-ZA"};
const SLOTS=["kicker","headline","subline","body","cta","footnote"];
const SLOT_LABEL={kicker:"Kicker (small label)",headline:"Headline on image",subline:"Subline on image",body:"Body on image",cta:"Call to action",footnote:"Footnote / legal line"};
const FONT_LIB=[
  {f:"Anton",w:[400],c:"condensed display, heavy"},
  {f:"Bebas Neue",w:[400],c:"condensed display, capitals only"},
  {f:"Oswald",w:[400,600,700],c:"condensed sans"},
  {f:"Barlow Condensed",w:[500,700,800],i:[700],c:"condensed sans"},
  {f:"Archivo",w:[400,600,800,900],c:"grotesque sans"},
  {f:"Montserrat",w:[400,600,800,900],i:[800],c:"geometric sans"},
  {f:"Poppins",w:[400,600,800],c:"friendly geometric sans"},
  {f:"DM Sans",w:[400,500,700],c:"clean text sans"},
  {f:"Syne",w:[600,800],c:"expressive wide sans"},
  {f:"Unbounded",w:[500,800],c:"wide rounded display"},
  {f:"Fraunces",w:[400,700,900],i:[400,700],c:"soft display serif"},
  {f:"DM Serif Display",w:[400],i:[400],c:"high-contrast serif"},
  {f:"Playfair Display",w:[400,700,900],i:[400,700],c:"classic serif"},
  {f:"Instrument Serif",w:[400],i:[400],c:"elegant condensed serif"},
  {f:"Caveat",w:[500,700],c:"handwriting"},
  {f:"Permanent Marker",w:[400],c:"marker handwriting"},
  {f:"Space Mono",w:[400,700],c:"monospace"}
];
const GROUPS=[
  {k:"briefing",label:"Briefing and brand documents",hint:"PDF, Word, PowerPoint or TXT. The text goes into the brief, and the pictures and pages inside are extracted for the agents.",accept:".pdf,.docx,.pptx,.txt,.md,image/*"},
  {k:"visual",label:"Photos and graphics to use",hint:"Client photos, product shots, illustrations, campaign graphics. The art director places these in the posts.",accept:"image/*"},
  {k:"reference",label:"Style references",hint:"Posts, campaigns or moodboards the client likes. The art director studies them and designs in that direction.",accept:"image/*"}
];
const IMG_KINDS=["visual","reference","briefimg","briefpage","generated"];
const KIND_LABEL={visual:"client photo or graphic",reference:"style reference",briefimg:"image from the briefing",briefpage:"briefing page",generated:"generated image",logo:"logo"};
const ROLE_NEXT={post:"style",style:"none",none:"post"};
const ROLE_LABEL={post:"use",style:"style",none:"skip",logo:"logo"};
const EXT_TYPES={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",svg:"image/svg+xml",pdf:"application/pdf",txt:"text/plain",md:"text/markdown",csv:"text/csv",json:"application/json",woff2:"font/woff2",woff:"font/woff",ttf:"font/ttf",otf:"font/otf"};
const SAMPLE_TYPES=["image/png","image/jpeg","image/webp","image/gif"];
const AGENTS=[
  {k:"strategist",name:"Strategist",role:"Reads the brief and its documents, sets objective, audiences, pillars and the post plan, and lists what is missing from the client."},
  {k:"copy",name:"Copywriter",role:"Writes every post in Portuguese for Mozambique and English for South Africa: text on the image, captions, hashtags and alt text."},
  {k:"visual",name:"Art director",role:"Studies the references and the client's images, sets the campaign look, designs each post with real photos and original graphics, then checks its own renders and fixes them."},
  {k:"qa",name:"Brand QA",role:"Checks both language versions and the finished designs against the brief, language rules and risk, and proposes fixes."}
];
const SVG_NS="http://www.w3.org/2000/svg";
const PIXEL="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

// ================= state =================
const S={db:null,assets:null,sample:null,downloads:null,mcp:null,ready:false,noRuntime:false,canva:false,
  clients:[],jobs:[],posts:{},postsFor:null,postsUnsub:null,loaded:{clients:false,jobs:false,posts:null},
  view:{name:"board"},runs:{},limits:null,filterClient:"",pendingRender:false,confirm:null,editing:null,lang:"pt"};

// ================= helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const slug=s=>String(s||"job").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"job";
const hex=v=>{const s=String(v||"").trim();if(/^#[0-9a-f]{6}$/i.test(s)) return s.toUpperCase();if(/^#[0-9a-f]{3}$/i.test(s)) return ("#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3]).toUpperCase();return null};
const num=(v,d=0)=>{const n=+v;return v!==null&&v!==""&&Number.isFinite(n)?n:d};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const codeOf=a=>"img-"+String(a?.id||"").slice(0,8).toLowerCase();
const isImg=a=>!!(a&&a.id&&/^image\//.test(a.type||""));
const clientOf=j=>S.clients.find(c=>c.id===j?.clientId);
const jobById=id=>S.jobs.find(j=>j.id===id);
const langsOf=j=>j?.languages==="pt"?["pt"]:j?.languages==="en"?["en"]:["pt","en"];
const pidOf=n=>"p"+String(n).padStart(2,"0");
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function luminance(h){const n=parseInt(h.slice(1),16);const c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrastOn(bg){return luminance(bg)>.4?"#111111":"#FFFFFF"}
function contrastRatio(a,b){const l1=luminance(a),l2=luminance(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4800)}
function copyText(txt){try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>toast("Copy is blocked here. Select the text and copy it manually."))}catch(e){toast("Copy is blocked here. Select the text and copy it manually.")}}
const scriptLoads={};
function loadScript(src){return scriptLoads[src]||(scriptLoads[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete scriptLoads[src];rej(new Error("Could not load a library. Check your connection."))};document.head.appendChild(s)}))}
function canvasBlob(cv,type="image/png",q){return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("Could not export the image.")),type,q))}
function b64Blob(b64,type){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
async function pool(items,n,fn){let i=0;const work=async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}};await Promise.all(Array.from({length:Math.min(n,items.length)},work))}
function userErr(message){return {code:"user",message}}

// ================= storage =================
const Q={};
function queued(key,fn){const p=(Q[key]||Promise.resolve()).then(fn);Q[key]=p.catch(()=>{});return p}
function dbMsg(e){return e?.code==="quota_exceeded"?"Storage is full. Delete old jobs to free space.":e?.code==="invalid_argument"?"You don't have permission to change this. Ask the owner for Contributor access.":"Could not save. Check your connection and try again."}
function patchDoc(path,patch){return queued(path,()=>S.db.doc(path).update(patch)).catch(e=>{toast(dbMsg(e));throw e})}
function savePost(jid,pid,fn){const path=`jobs/${jid}/posts/${pid}`;return queued(path,async()=>{const ref=S.db.doc(path);const snap=await ref.get();const cur=snap.exists?clone(snap.data()):null;const next=fn(cur);if(!next) return;next.updatedAt=Date.now();await ref.set(next)}).catch(e=>{toast(dbMsg(e));throw e})}
async function getPosts(jid){const s=await S.db.collection(`jobs/${jid}/posts`).get();return s.docs.map(d=>({...clone(d.data()),id:d.id})).sort((a,b)=>a.n-b.n)}

  const im=await loadImg(L.id);if(!im) return null;
  const base=await prepLogo(L,im);
  const v=String(spec?.variant||"original");const col=v==="white"?"#FFFFFF":v==="black"?"#000000":hex(v);
  if(!col) return base;
  if(!base.clean){warn.push("The logo has a solid background, so it can't be shown in white or black. Upload a PNG with a transparent background or an SVG.");return base}
  const oc=document.createElement("canvas");oc.width=base.src.width||base.w;oc.height=base.src.height||base.h;
  const o=oc.getContext("2d");o.drawImage(base.src,0,0,oc.width,oc.height);o.globalCompositeOperation="source-in";o.fillStyle=col;o.fillRect(0,0,oc.width,oc.height);
  return {src:oc,w:base.w,h:base.h,clean:true};
}
async function logoNote(c){const L=logoAsset(c,{});if(!L) return "There is no logo file: the page writes the client name instead.";const im=await loadImg(L.id);const b=im?await prepLogo(L,im):null;return b?.clean?"The logo can be shown in its original colours, white, black or any hex colour.":"The logo has a solid background: keep variant original and place it on a calm, light area."}
function logoBox(spec,lw,lh){
  const x=num(spec.x),y=num(spec.y),w=Math.max(20,num(spec.w,200)),h=Math.max(12,num(spec.h,80));
  const r=Math.min(w/lw,h/lh);const dw=lw*r,dh=lh*r;
  return {x:spec.align==="left"?x:spec.align==="center"?x+(w-dw)/2:x+w-dw,y:y+(h-dh)/2,w:dw,h:dh};
}
async function drawLogo(ctx,c,spec,warn){
  if(!spec) return;
  const L=await logoSource(c,spec,warn);
  if(!L){
    if(!c?.name) return;
    const fd=resolveFont(c,"Archivo",800,false);await fontCssReady;try{await document.fonts.load(fontStr(fd,40),c.name)}catch(e){}
    const h=Math.max(12,num(spec.h,80));ctx.save();ctx.font=fontStr(fd,Math.round(h*0.42));ctx.textBaseline="middle";const v=String(spec.variant||"");ctx.fillStyle=v==="white"?"#FFFFFF":v==="black"?"#111111":hex(v)||"#111111";
    const tw=ctx.measureText(c.name).width;const x=num(spec.x),w=num(spec.w,200);ctx.fillText(c.name,spec.align==="left"?x:spec.align==="center"?x+(w-tw)/2:x+w-tw,num(spec.y)+h/2);ctx.restore();return;
  }
  const b=logoBox(spec,L.w,L.h);ctx.save();ctx.globalAlpha=clamp(num(spec.opacity,1),0,1);ctx.drawImage(L.src,b.x,b.y,b.w,b.h);ctx.restore();
}

function sizeOf(job,post){return FORMATS[post?.format]||FORMATS[job?.format]||FORMATS.portrait}
function defaultDesign(job,post){
  const c=clientOf(job);const F=sizeOf(job,post);const W=F.w,H=F.h;
  const pal=(c?.palette||[]).map(hex).filter(Boolean);const bg=pal[0]||"#1E2B28";const fg=contrastOn(bg);

    texts:[
      {slot:"kicker",x:80,y:top,w:W-480,h:56,font:"DM Sans",weight:700,size:32,tracking:0.08,case:"upper",color:fg,align:"left",valign:"top"},
      {slot:"headline",x:80,y:Math.round(H*0.34),w:W-160,h:Math.round(H*0.34),font:"Archivo",weight:900,size:132,minSize:60,lineHeight:0.98,color:fg,align:"left",valign:"bottom"},
      {slot:"subline",x:80,y:Math.round(H*0.70),w:W-260,h:Math.round(H*0.12),font:"DM Sans",weight:500,size:42,minSize:28,lineHeight:1.25,color:fg,align:"left",valign:"top",opacity:0.9},
      {slot:"cta",x:80,y:bot-64,w:Math.round(W*0.5),h:64,font:"DM Sans",weight:700,size:32,minSize:26,color:fg,align:"left",valign:"middle"}
    ],
    logo:{x:W-80-230,y:bot-84,w:230,h:84,align:"right",variant:luminance(bg)<0.35?"white":"original"}};

async function renderPost(job,post,lang,design){
  const c=clientOf(job);await loadBrandFonts(c);
  const F=sizeOf(job,post),W=F.w,H=F.h;const d=design||post.design||defaultDesign(job,post);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");const warn=[];
  ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
  if(d.bg){try{await drawSvgLayer(ctx,job,d.bg,W,H,"b-",warn)}catch(e){if(design) throw e;warn.push("Background: "+(e.message||e));ctx.fillStyle="#D9DED9";ctx.fillRect(0,0,W,H)}}
  for(const b of Array.isArray(d.texts)?d.texts:[]) await drawBox(ctx,c,post,lang,b,warn);
  if(d.fg){try{await drawSvgLayer(ctx,job,d.fg,W,H,"f-",warn)}catch(e){if(design) throw e;warn.push("Foreground: "+(e.message||e))}}

}
const renderCache=new Map();
function renderKey(job,post,lang){const c=clientOf(job);return hashStr(JSON.stringify([post.id,lang,post.format,post.design||null,post[lang]||null,c?.palette,c?.name,(c?.logos||[]).map(a=>a.id),(c?.fonts||[]).map(f=>f.id+f.family+f.weight),(job.assets||[]).length]))}
function renderCached(job,post,lang){
  const k=renderKey(job,post,lang);
  if(!renderCache.has(k)){const p=renderPost(job,post,lang);renderCache.set(k,p);p.catch(()=>renderCache.delete(k));if(renderCache.size>90) renderCache.delete(renderCache.keys().next().value)}
  return renderCache.get(k);
}
function drawPreviews(root){
  if(S.view.name!=="job") return;const job=jobById(S.view.id);if(!job) return;
  for(const cv of root.querySelectorAll("canvas[data-pid]")){
    const post=(S.posts[job.id]||[]).find(p=>p.id===cv.dataset.pid);if(!post) continue;
    renderCached(job,post,cv.dataset.lang).then(r=>{if(!cv.isConnected) return;cv.width=Math.round(r.canvas.width/2);cv.height=Math.round(r.canvas.height/2);const x=cv.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(r.canvas,0,0,cv.width,cv.height);
      const wEl=cv.closest(".post")?.querySelector("[data-warn]");if(wEl){wEl.hidden=!r.warn.length;wEl.textContent=r.warn.length?"Render notes: "+[...new Set(r.warn)].join(" "):""}}).catch(()=>{});
  }
}
async function tryRender(job,post,design,langs){
  const out={warn:[],blobs:[]};
  for(const lang of langs){
    try{const r=await renderPost(job,post,lang,design);out.warn.push(...r.warn);
      const sc=Math.min(1,1100/Math.max(r.canvas.width,r.canvas.height));const t=document.createElement("canvas");t.width=Math.round(r.canvas.width*sc);t.height=Math.round(r.canvas.height*sc);t.getContext("2d").drawImage(r.canvas,0,0,t.width,t.height);
      out.blobs.push(await canvasBlob(t,"image/jpeg",0.85));}
    catch(e){return {error:e?.message||String(e)}}
  }
  out.warn=[...new Set(out.warn)];return out;
}

function xmlEsc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function exportSvg(job,post,lang){
  const c=clientOf(job);const F=sizeOf(job,post),W=F.w,H=F.h;const d=post.design||defaultDesign(job,post);const warn=[];
  const layer=async(src,prefix,id)=>{if(!src) return "";const p=prepSvg(src,W,H,prefix,warn);if(!p) return "";await inlineImages(job,p,warn);p.root.setAttribute("x","0");p.root.setAttribute("y","0");p.root.setAttribute("id",id);return new XMLSerializer().serializeToString(p.root)};
  const bg=await layer(d.bg,"b-","background"),fg=await layer(d.fg,"f-","foreground");
  const ctx=document.createElement("canvas").getContext("2d");let texts="";
  for(const b of Array.isArray(d.texts)?d.texts:[]){
    const L=await layoutBox(ctx,c,post,lang,b);if(!L) continue;
    const rot=num(b.rotate)?` transform="rotate(${num(b.rotate)} ${L.x+L.w/2} ${L.y+L.h/2})"`:"";
    let g=`<g id="${xmlEsc(b.slot)}"${rot} opacity="${clamp(num(b.opacity,1),0,1)}">`;
    const hl=b.highlight&&hex(b.highlight.color)?b.highlight:null;
    if(hl){const px=num(hl.padX,14),py=num(hl.padY,6);for(const l of L.lines) if(l.t) g+=`<rect x="${(l.x-px).toFixed(1)}" y="${(l.base-L.cap-py).toFixed(1)}" width="${(l.w+px*2).toFixed(1)}" height="${(L.cap+L.desc*0.55+py*2).toFixed(1)}" rx="${num(hl.radius,0)}" fill="${hex(hl.color)}"/>`}
    const st=b.stroke&&hex(b.stroke.color)?` stroke="${hex(b.stroke.color)}" stroke-width="${num(b.stroke.width,3)}" stroke-linejoin="round" paint-order="stroke"`:"";
    g+=`<text font-family="${xmlEsc(L.fd.family)}" font-weight="${L.fd.weight}"${L.fd.italic?' font-style="italic"':""} font-size="${L.size}" letter-spacing="${(L.tr*L.size).toFixed(2)}" fill="${b.fill===false?"none":hex(b.color)||"#111111"}"${st} xml:space="preserve">`;
    for(const l of L.lines) if(l.t) g+=`<tspan x="${l.x.toFixed(1)}" y="${l.base.toFixed(1)}">${xmlEsc(l.t)}</tspan>`;
    texts+=g+"</text></g>";
  }
  let logo="";
  if(d.logo){const L=await logoSource(c,d.logo,warn);if(L){const b=logoBox(d.logo,L.w,L.h);let uri;if(L.src instanceof HTMLCanvasElement) uri=L.src.toDataURL("image/png");else uri=await assetURI(logoAsset(c,d.logo));logo=`<image id="logo" x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}" opacity="${clamp(num(d.logo.opacity,1),0,1)}" href="${uri}"/>`}}
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="${SVG_NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n<rect width="${W}" height="${H}" fill="#FFFFFF"/>\n${bg}\n<g id="text">${texts}</g>\n${fg}\n${logo}\n</svg>`;
}

  if(j.delivered) return "delivered";
  const s=j.summary,ag=j.agents||{};
  if(s&&s.total){if(s.approved>=s.total) return "approved";if(ag.qa?.status==="done") return "review";return "production"}
  if(Array.isArray(j.posts)&&j.posts.length) return "production";
  return Object.values(ag).some(a=>a&&a.status==="done")?"production":"brief";
}

function liveText(run){if(!run) return "";const streams=Object.entries(run.streams||{}).map(([k,v])=>`${k} is writing… ${v.toLocaleString()} characters`);return [...(run.log||[]).slice(-9),...streams].join("\n")}

function bind(app){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const g=b.dataset.go;go(g==="newclient"?{name:"client"}:{name:g})});
  app.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>go({name:"job",id:b.dataset.job}));
  app.querySelectorAll("[data-client]").forEach(b=>b.onclick=()=>b.dataset.client&&go({name:"client",id:b.dataset.client}));
  const fc=$("#f-client");if(fc) fc.onchange=()=>{S.filterClient=fc.value;render()};
  const cf=$("#client-form");if(cf) cf.onsubmit=e=>{e.preventDefault();saveClient()};
  const jf=$("#job-form");if(jf) jf.onsubmit=e=>{e.preventDefault();createJob()};
  app.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>saveField(el));
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>jobAction(b.dataset.act));
  app.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>runPipeline(S.view.id,[b.dataset.run]));
  app.querySelectorAll("[data-pact]").forEach(b=>b.onclick=()=>postAction(b.dataset.pact,b.dataset.pid));
  app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;S.editing=null;render()});
  app.querySelectorAll("[data-upload]").forEach(inp=>inp.onchange=()=>{const z=inp.closest("[data-drop]");handleFiles([...inp.files],z.dataset.drop,z.dataset.owner,z.dataset.oid);inp.value=""});
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeFile(b.dataset.rm));
  app.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>cycleRole(b.dataset.role));
  app.querySelectorAll("[data-font]").forEach(el=>el.onchange=()=>saveFontField(el));
  app.querySelectorAll("[data-rmfont]").forEach(b=>b.onclick=()=>removeFont(+b.dataset.rmfont));
  if(S.assets) app.querySelectorAll("[data-drop]").forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.classList.add("over")};
    z.ondragleave=()=>z.classList.remove("over");
    z.ondrop=e=>{e.preventDefault();z.classList.remove("over");handleFiles([...e.dataTransfer.files],z.dataset.drop,z.dataset.owner,z.dataset.oid)};
  });
}

  const data={name:$("#c-name").value.trim(),sector:$("#c-sector").value.trim(),handles:$("#c-handles").value.trim(),
    palette:$("#c-palette").value.split(/[\s,;]+/).map(hex).filter(Boolean),tone:$("#c-tone").value.trim(),
    dos:$("#c-dos").value.trim(),donts:$("#c-donts").value.trim(),look:$("#c-look").value.trim(),notes:$("#c-notes").value.trim(),updatedAt:Date.now()};
  if(!data.name) return toast("Add the client name.");
  try{
    if(id){await patchDoc("clients/"+id,data);toast("Profile saved")}
    else{const ref=await S.db.collection("clients").add({...data,logos:[],fonts:[],createdAt:Date.now()});toast("Client created. Add the logos and brand fonts now.");go({name:"client",id:ref.id})}

async function createJob(){

function saveField(el){

async function jobAction(act){
  const id=S.view.id;const j=jobById(id);if(!j) return;
  if(act==="del-job"){
    if(S.confirm!=="del-job"){S.confirm="del-job";render();setTimeout(()=>{if(S.confirm==="del-job"){S.confirm=null;render()}},5000);return}
    S.confirm=null;
    try{const posts=await getPosts(id);for(const p of posts) await S.db.doc(`jobs/${id}/posts/${p.id}`).delete();await S.db.doc("jobs/"+id).delete();
      if(S.assets) for(const a of j.assets||[]) if(a.id) await S.assets.delete(a.id).catch(()=>{});
      toast("Job deleted");go({name:"board"})}catch(e){toast(dbMsg(e))}

async function ensurePdf(){if(!window.pdfjsLib){await loadScript(CDN.pdf);window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([`importScripts("${CDN.pdfWorker}");`],{type:"text/javascript"}))}return window.pdfjsLib}
async function ensureZip(){if(!window.JSZip) await loadScript(CDN.zip);return window.JSZip}
function pdfObj(pg,name){return new Promise(res=>{const store=name.startsWith("g_")?pg.commonObjs:pg.objs;const t=setTimeout(()=>res(null),5000);try{store.get(name,o=>{clearTimeout(t);res(o)})}catch(e){clearTimeout(t);res(null)}})}
function pdfImgCanvas(o){
  if(!o) return null;const cv=document.createElement("canvas");
  if(o.bitmap){cv.width=o.bitmap.width;cv.height=o.bitmap.height;cv.getContext("2d").drawImage(o.bitmap,0,0);return cv}
  if(!o.data||!o.width||!o.height) return null;cv.width=o.width;cv.height=o.height;const x=cv.getContext("2d");const id=x.createImageData(o.width,o.height);
  if(o.kind===3) id.data.set(o.data.subarray?o.data.subarray(0,id.data.length):o.data);
  else if(o.kind===2){for(let s=0,d=0;d<id.data.length;s+=3,d+=4){id.data[d]=o.data[s];id.data[d+1]=o.data[s+1];id.data[d+2]=o.data[s+2];id.data[d+3]=255}}
  else return null;
  x.putImageData(id,0,0);return cv;
}
async function extractPdf(file,progress){
  const lib=await ensurePdf();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const n=Math.min(doc.numPages,60);const texts=[],pages=[],images=[];const seen=new Set();
  for(let i=1;i<=n;i++){
    progress(`Reading ${file.name}, page ${i} of ${n}…`);
    const pg=await doc.getPage(i);
    const tc=await pg.getTextContent();texts.push(tc.items.map(t=>t.str+(t.hasEOL?"\n":" ")).join("").replace(/[ \t]+\n/g,"\n").trim());
    if(i<=12){const vp=pg.getViewport({scale:1});const sc=Math.min(2.5,1400/Math.max(vp.width,vp.height));const v2=pg.getViewport({scale:sc});const cv=document.createElement("canvas");cv.width=Math.round(v2.width);cv.height=Math.round(v2.height);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);await pg.render({canvasContext:x,viewport:v2}).promise;pages.push({blob:await canvasBlob(cv,"image/jpeg",0.85),w:cv.width,h:cv.height,page:i})}
    if(images.length<16){try{
      const ops=await pg.getOperatorList();
      for(let k=0;k<ops.fnArray.length&&images.length<16;k++){
        const fn=ops.fnArray[k];if(fn!==lib.OPS.paintImageXObject&&fn!==lib.OPS.paintImageXObjectRepeat) continue;
        const name=ops.argsArray[k][0];const key=name.startsWith("g_")?name:i+":"+name;if(seen.has(key)) continue;seen.add(key);
        const cv=pdfImgCanvas(await pdfObj(pg,name));if(!cv||Math.min(cv.width,cv.height)<280) continue;
        const sig=cv.width+"x"+cv.height;if(seen.has(sig)) continue;seen.add(sig);
        const sc=Math.min(1,2400/Math.max(cv.width,cv.height));let out=cv;if(sc<1){out=document.createElement("canvas");out.width=Math.round(cv.width*sc);out.height=Math.round(cv.height*sc);out.getContext("2d").drawImage(cv,0,0,out.width,out.height)}
        images.push({blob:await canvasBlob(out,"image/jpeg",0.9),type:"image/jpeg",w:out.width,h:out.height,page:i});
      }
    }catch(e){}}
  }
  return {text:texts.filter(Boolean).join("\n\n"),pages,images};
}
function officeText(xml,ns){
  const doc=new DOMParser().parseFromString(xml,"application/xml");const P=doc.getElementsByTagName(ns+":p");const lines=[];
  for(const p of P){let s="";for(const n of p.getElementsByTagName("*")){const ln=n.localName;if(ln==="t") s+=n.textContent;else if(ln==="tab") s+="\t";else if(ln==="br") s+="\n"}if(s.trim()) lines.push(s.trim())}
  return lines.join("\n");
}
async function extractOffice(file,ext,progress){
  const Zip=await ensureZip();progress(`Reading ${file.name}…`);const zip=await Zip.loadAsync(await file.arrayBuffer());let text="";
  if(ext==="docx"){const xml=await zip.file("word/document.xml")?.async("string");text=xml?officeText(xml,"w"):""}
  else{const slides=Object.keys(zip.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a,b)=>+a.match(/(\d+)\.xml$/)[1]-+b.match(/(\d+)\.xml$/)[1]);const out=[];for(const s of slides){const t=officeText(await zip.file(s).async("string"),"a");if(t) out.push(`[Slide ${s.match(/(\d+)\.xml$/)[1]}]\n${t}`)}text=out.join("\n\n")}
  const media=Object.keys(zip.files).filter(p=>/^(word|ppt)\/media\/[^/]+\.(png|jpe?g|gif|webp)$/i.test(p));const images=[];
  for(const m of media){if(images.length>=20) break;try{const b=await zip.file(m).async("blob");const nm=m.split("/").pop();const f=new File([b],nm,{type:EXT_TYPES[nm.split(".").pop().toLowerCase()]});const info=await prepImageBlob(f);if(Math.min(info.w,info.h)<280) continue;images.push({...info,name:nm})}catch(e){}}
  return {text,images};
}
async function storeBlob(blob,type,rec){const r=await S.assets.upload(blob,{type});return {...rec,id:r.id,type,size:r.sizeBytes,at:Date.now()}}
async function handleFiles(files,kind,ownerType,ownerId){
  if(!S.assets||!files.length) return;
  const recs=[];let added="";const progress=m=>toast(m);
  for(const file of files){
    const ext=(file.name.split(".").pop()||"").toLowerCase();const type=EXT_TYPES[ext]||"";
    try{
      if(kind==="font"){if(!/^font\//.test(type)){toast(`${file.name}: use TTF, OTF, WOFF or WOFF2.`);continue}
        const base=file.name.replace(/\.[^.]+$/,"");const wmap=[[/thin|hairline/i,100],[/extra ?light|ultra ?light/i,200],[/light/i,300],[/medium/i,500],[/semi ?bold|demi/i,600],[/extra ?bold|ultra ?bold/i,800],[/black|heavy/i,900],[/bold/i,700]];
        const weight=(wmap.find(([r])=>r.test(base))||[0,400])[1];const italic=/italic|oblique/i.test(base);
        const family=base.replace(/([-_ ]?(thin|hairline|extra ?light|ultra ?light|light|regular|book|medium|semi ?bold|demi ?bold|extra ?bold|ultra ?bold|bold|black|heavy|italic|oblique))+$/ig,"").replace(/[-_]+/g," ").trim()||base;
        progress(`Uploading ${file.name}…`);recs.push(await storeBlob(file,type,{name:file.name,kind:"font",family,weight,italic}));continue}
      if(kind==="logo"||kind==="visual"||kind==="reference"||(kind==="briefing"&&/^image\//.test(type))){
        if(!/^image\//.test(type)){toast(`${file.name}: use JPG, PNG, WebP or SVG.${/heic|heif/.test(ext)?" Convert HEIC photos to JPG first.":""}`);continue}
        progress(`Uploading ${file.name}…`);const info=await prepImageBlob(file);
        recs.push(await storeBlob(info.blob,info.type,{name:file.name,kind:kind==="briefing"?"briefimg":kind,w:info.w,h:info.h,alpha:info.alpha}));continue}
      if(kind==="briefing"){
        let text="",pages=[],images=[];
        if(ext==="pdf"){({text,pages,images}=await extractPdf(file,progress))}
        else if(ext==="docx"||ext==="pptx"){({text,images}=await extractOffice(file,ext,progress))}
        else if(ext==="txt"||ext==="md"||ext==="csv") text=await file.text();
        else{toast(`${file.name}: use PDF, Word (.docx), PowerPoint (.pptx) or TXT.${/^(doc|ppt)$/.test(ext)?" Save it in the newer format first.":""}`);continue}
        const rec={name:file.name,kind:"briefing",type:type||file.type||"",size:file.size,textChars:text.length,at:Date.now(),id:null};
        if(type&&file.size<=2e7){try{Object.assign(rec,await storeBlob(file,type,rec))}catch(e){}}
        recs.push(rec);
        for(const p of pages){progress(`Saving page ${p.page} of ${file.name}…`);recs.push(await storeBlob(p.blob,"image/jpeg",{name:`${file.name} p.${p.page}`,kind:"briefpage",from:file.name,page:p.page,w:p.w,h:p.h}))}
        let k=0;for(const im of images){k++;progress(`Saving image ${k} of ${images.length} from ${file.name}…`);recs.push(await storeBlob(im.blob,im.type||"image/jpeg",{name:im.name||`${file.name} image ${k}`,kind:"briefimg",from:file.name,page:im.page||null,w:im.w,h:im.h,alpha:!!im.alpha}))}
        if(text) added+=`\n\n--- From ${file.name} ---\n${text.slice(0,60000)}`;
        continue;
      }
    }catch(e){toast(`${file.name}: ${({too_large:"the file is over 20 MB",unsupported_type:"this file type can't be stored",quota_or_state:"storage is full"})[e?.code]||e?.message||"upload failed"}.`)}
  }
  if(!recs.length) return;
  try{
    if(ownerType==="client"){await queued("clients/"+ownerId,async()=>{const c=S.clients.find(x=>x.id===ownerId);const field=kind==="font"?"fonts":"logos";const next=[...clone(c?.[field]||[]),...recs];await S.db.doc("clients/"+ownerId).update({[field]:next,updatedAt:Date.now()});if(c) c[field]=next})}
    else{await queued("jobs/"+ownerId,async()=>{const j=jobById(ownerId);const patch={assets:[...clone(j.assets||[]),...recs],updatedAt:Date.now()};if(added) patch.briefText=((j.briefText||"")+added).trim();await S.db.doc("jobs/"+ownerId).update(patch);Object.assign(j,patch)})}
    const nImg=recs.filter(r=>r.kind==="briefimg"||r.kind==="briefpage").length;
    toast(`${recs.length} file${recs.length>1?"s":""} added${added?". Brief text extracted":""}${nImg&&kind==="briefing"?`. ${nImg} pictures and pages found in the documents`:""}.`);
    render();
  }catch(e){toast(dbMsg(e))}
}

function parseDesign(text,W,H){
  const get=tag=>{const m=new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`,"i").exec(text);return m?m[1].trim():""};
  const svgOf=s=>{const a=s.search(/<svg[\s>]/i),b=s.toLowerCase().lastIndexOf("</svg>");return a>=0&&b>a?s.slice(a,b+6):""};
  const bg=svgOf(get("background"));if(!bg) throw {svg:true,message:"The design has no background SVG."};
  const raw=get("spec").replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();const a=raw.indexOf("{"),b=raw.lastIndexOf("}");if(a<0||b<a) throw {svg:true,message:"The <spec> block is missing."};
  let spec;try{spec=JSON.parse(raw.slice(a,b+1))}catch(e){throw {svg:true,message:"The <spec> block is not valid JSON."}}
  const texts=(Array.isArray(spec.texts)?spec.texts:[]).filter(t=>t&&(SLOTS.includes(t.slot)||t.slot==="custom")).map(t=>({...t,x:num(t.x),y:num(t.y),w:num(t.w,W-160),h:num(t.h,200),size:num(t.size,80)}));
  const lg=spec.logo&&typeof spec.logo==="object"?spec.logo:{x:W-300,y:H-170,w:220,h:90,align:"right",variant:"original"};
  return {concept:get("concept"),bg,fg:svgOf(get("foreground")),texts,logo:lg};
}

    const arr=Array.isArray(out)?out:Array.isArray(out?.images)?out.images:[];
    await mergeAssets(id,list=>list.map(a=>{const k=used.findIndex(u=>u.id===a.id);if(k<0) return a;const m=arr.find(x=>String(x?.code||"").toLowerCase()===codeOf(a))||arr[k];const base={...a,w:a.w||used[k].w,h:a.h||used[k].h};if(!m) return base;
      const meta={what:String(m.what||""),colours:(Array.isArray(m.colours)?m.colours:[]).map(hex).filter(Boolean).slice(0,4),mood:String(m.mood||""),focus:m.focus&&typeof m.focus==="object"?{x:clamp(num(m.focus.x,.5),0,1),y:clamp(num(m.focus.y,.5),0,1)}:null,textSpace:String(m.textSpace||""),quality:String(m.quality||""),use:["post","style","none"].includes(m.use)?m.use:"post",rights:String(m.rights||""),notes:String(m.notes||"")};
      if(a.meta?.userUse){meta.use=a.meta.use;meta.userUse=true}
      return {...base,meta}}));
    doneN+=used.length;
  }
  logLine(run,`Image analyst described ${doneN} image${doneN===1?"":"s"}.`);
}
async function designPost(id,pid,run,o){
  const j=jobById(id);const cur=(await getPosts(id)).find(p=>p.id===pid);if(!cur) return;
  if(!j.direction) throw userErr("Run the art director first so the campaign direction exists.");
  const F=sizeOf(j,cur);const langs=langsOf(j);const plan=cur.plan||{};
  const c=clientOf(j);const logo=(c?.logos||[]).find(isImg);
  const lib=allImages(j).filter(a=>a.kind!=="logo"&&roleOf(a)!=="none");
  const planned=(plan.images||[]).map(cd=>assetByCode(j,cd)).filter(Boolean);
  const refs=(j.direction.fromReferences||[]).map(r=>assetByCode(j,String(r?.code||"").toLowerCase())).filter(Boolean);
  const max=maxImages();const pick=max?[...planned.slice(0,2),...refs.slice(0,2),...(logo?[{...logo,kind:"logo"}]:[])].slice(0,max):[];
  const {blobs,used}=await blobsFor(pick);
  const tier=j.quality==="fast"?"default":"complex";
  logLine(run,`Post ${cur.n}: designing${o.note?" with your note":o.variant?" a new version":""}…`);
  const lnote=await logoNote(c).catch(()=>"");
  let text=await ask(run,`Post ${cur.n}`,PROMPTS.design(j,cur,plan,used,lib,{note:o.note,variant:o.variant,logoNote:lnote,current:(o.note||o.variant)&&cur.design&&!cur.design.draft?cur.design:null}),{images:blobs,tier});
  let d,test;
  for(let attempt=0;attempt<2;attempt++){
    try{d=parseDesign(text,F.w,F.h);test=await tryRender(j,cur,d,langs)}catch(e){test={error:e?.message||String(e)}}
    if(!test.error) break;
    if(attempt===1) throw new Error(`Post ${cur.n}: the design could not be rendered (${test.error})`);
    logLine(run,`Post ${cur.n}: fixing a render problem…`);
    text=await ask(run,`Post ${cur.n} fix`,PROMPTS.fix(test.error,text),{tier:"default"});
  }
  if(j.quality!=="fast"&&canSendImages()&&!run.ctl.signal.aborted){
    try{
      const imgs=[...test.blobs];const labels=langs.map(l=>`your post rendered in ${LANG_TAG[l]}`);
      if(planned[0]&&imgs.length<max){const b=await sampleBlob(planned[0]);if(b){imgs.push(b);labels.push(`the source photo ${codeOf(planned[0])}`)}}
      logLine(run,`Post ${cur.n}: reviewing its own render…`);
      const t2=await ask(run,`Post ${cur.n} review`,PROMPTS.review(j,cur,plan,labels.slice(0,max),designToText(d),test.warn),{images:imgs.slice(0,max),tier:"default"});
      const d2=parseDesign(t2,F.w,F.h);const r2=await tryRender(j,cur,d2,langs);
      if(!r2.error){d=d2;test=r2}else logLine(run,`Post ${cur.n}: kept the first version (${r2.error})`);
    }catch(e){if(e?.code==="cancelled") throw e;logLine(run,`Post ${cur.n}: review skipped (${sampleMsg(e)})`)}
  }
  await savePost(id,pid,p=>p&&{...p,design:{...d,at:Date.now(),warn:test.warn||[]},prevDesign:p.design&&!p.design.draft?p.design:p.prevDesign||null,status:p.status==="approved"||o.note?"draft":p.status,...(o.note?{note:"",revisedFrom:o.note}:{})});
  logLine(run,`Post ${cur.n}: design ready.`);
}
async function reviseCopy(id,pid,note,run){
  const j=jobById(id);const cur=(await getPosts(id)).find(p=>p.id===pid);if(!cur) return;
  const out=await ask(run,`Post ${cur.n} copy`,PROMPTS.reviseCopy(j,cur,note),{json:true});
  await savePost(id,pid,p=>{if(!p) return null;for(const l of langsOf(j)){const src=out?.[l];if(!src||typeof src!=="object") continue;const next={...(p[l]||{})};for(const k of [...SLOTS,"caption","altText"]) if(typeof src[k]==="string") next[k]=src[k];if(Array.isArray(src.hashtags)) next.hashtags=src.hashtags.map(String);p[l]=next}p.status="draft";p.revisedFrom=note;p.note="";p.qa=null;return p});
}

// ================= Canva (beta) =================
function deepFind(o,pred,depth=0){if(!o||typeof o!=="object"||depth>6) return undefined;for(const [k,v] of Object.entries(o)){if(pred(k,v)) return v;const r=deepFind(v,pred,depth+1);if(r!==undefined) return r}return undefined}
function deepStrings(o,out=[],depth=0){if(typeof o==="string") out.push(o);else if(o&&typeof o==="object"&&depth<7) for(const v of Object.values(o)) deepStrings(v,out,depth+1);return out}
function mcpImages(r){const out=[];for(const b of r?.content||[]){if(b?.type==="image"&&b.data) out.push({data:b.data,mime:b.mimeType||"image/png"});if(b?.type==="resource"&&b.resource?.blob&&/^image\//.test(b.resource.mimeType||"")) out.push({data:b.resource.blob,mime:b.resource.mimeType})}for(const s of deepStrings(r?.payload)){const m=/^data:(image\/[a-z+]+);base64,([\s\S]+)$/.exec(s);if(m) out.push({data:m[2],mime:m[1]})}return out}
function mcpLinks(r){const s=[...(r?.content||[]).filter(b=>b?.type==="text").map(b=>b.text),...deepStrings(r?.payload)].join(" ");return [...new Set((s.match(/https:\/\/[^\s"'<>)\]]+/g)||[]).filter(u=>/canva/i.test(u)))].slice(0,3)}
function mcpText(r){return [...(r?.content||[]).filter(b=>b?.type==="text").map(b=>b.text),JSON.stringify(r?.payload??"")].join(" ")}
function mcpMsg(e){return ({needs_reauth:"Reconnect Canva in claude.ai Settings, Connectors.",server_not_connected:"Add the Canva connector in claude.ai Settings, Connectors.",not_in_manifest:"Canva was not allowed for this page.",blocked_by_policy:"Your organisation blocks this Canva tool.",approval_required:"This Canva tool needs approval from your organisation.",selection_required:"Choose which Canva connection to use when the page asks."})[e?.code]||e?.message||"Canva could not generate the image."}
async function canvaForPost(id,pid,run){
  const cur=(await getPosts(id)).find(p=>p.id===pid);const prompt=cur?.plan?.imagePrompt;if(!prompt) throw userErr("This post has no image prompt yet. Run the art director first.");
  if(!S.mcp||!S.canva) throw userErr("Canva is not connected in this view.");
  const F=sizeOf(jobById(id),cur);logLine(run,`Post ${cur.n}: asking Canva for an image…`);
  const intent="Generate a campaign image for a social media post being designed in Playground Social Studio";
  try{
    const start=await S.mcp.callTool("Canva","generate-image",{prompt:prompt.slice(0,1800),aspectRatio:F.canva,user_intent:intent});
    let imgs=mcpImages(start),links=mcpLinks(start);
    const jobId=deepFind(start?.payload,(k,v)=>/^job_?id$/i.test(k)&&typeof v==="string")||(/job[_ ]?id\W{0,4}([A-Za-z0-9_-]{6,})/i.exec(mcpText(start))||[])[1];
    const t0=Date.now();
    while(!imgs.length&&jobId&&Date.now()-t0<200000){
      if(run.ctl.signal.aborted) throw {code:"cancelled"};
      await sleep(5000);
      const r=await S.mcp.callTool("Canva","get-generate-image-job",{jobId,user_intent:intent},{cache:false});
      imgs=mcpImages(r);links=[...new Set([...links,...mcpLinks(r)])];
      const status=String(deepFind(r?.payload,(k,v)=>/^status$/i.test(k)&&typeof v==="string")||(/\b(SUCCESS|FAILURE|FAILED|PENDING|IN_PROGRESS)\b/.exec(mcpText(r))||[])[1]||"");
      if(/FAIL/i.test(status)) throw new Error(String(deepFind(r?.payload,(k,v)=>/failure_?message/i.test(k)&&typeof v==="string")||"Canva could not generate the image."));
      if(/SUCC/i.test(status)&&!imgs.length&&links.length) break;
    }
    if(imgs.length){
      const b=b64Blob(imgs[0].data,imgs[0].mime);const info=await prepImageBlob(new File([b],"canva."+(imgs[0].mime.split("/")[1]||"png"),{type:imgs[0].mime}));
      const rec=await storeBlob(info.blob,info.type,{name:`canva-post-${cur.n}.${info.type==="image/png"?"png":"jpg"}`,kind:"generated",w:info.w,h:info.h,alpha:info.alpha,forPost:cur.n,meta:{what:"Generated with Canva for post "+cur.n+": "+prompt.slice(0,240),use:"post",rights:"client",quality:"high",colours:[],textSpace:"",notes:""}});
      await mergeAssets(id,list=>[...list,rec]);
      await savePost(id,pid,p=>p&&{...p,plan:{...(p.plan||{}),images:[codeOf(rec),...((p.plan?.images)||[])].slice(0,2),needsNewImage:false},gen:{status:"done",links,at:Date.now()}});
      logLine(run,`Post ${cur.n}: Canva image added to the job.`);return true;
    }
    await savePost(id,pid,p=>p&&{...p,gen:{status:links.length?"links":"error",links,error:links.length?"":"Canva did not return an image.",at:Date.now()}});
    logLine(run,`Post ${cur.n}: Canva ${links.length?"made the image, but it can only be opened in Canva":"did not return an image"}.`);return false;
  }catch(e){
    if(e?.code==="cancelled") throw e;
    await savePost(id,pid,p=>p&&{...p,gen:{status:"error",links:[],error:mcpMsg(e),at:Date.now()}}).catch(()=>{});
    logLine(run,`Post ${cur.n}: ${mcpMsg(e)}`);return false;
  }
}

function csvCell(s){s=String(s??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
async function exportPackage(j){
  toast("Building the package…");
  try{
    const Zip=await ensureZip();const zip=new Zip();const posts=S.posts[j.id]||[];const langs=langsOf(j);
    const head=["post","date","platform","format","pillar","status"];for(const l of langs) head.push(...["headline","subline","caption","hashtags","cta","alt_text"].map(k=>`${k}_${l}`));head.push("image_prompt");
    const rows=[head];
    for(const p of posts){
      for(const l of langs){const r=await renderPost(j,p,l);const nm=`${String(p.n).padStart(2,"0")}-${slug(p.platform)}`;zip.file(`${LANG_TAG[l]}/${nm}.png`,await canvasBlob(r.canvas));try{zip.file(`editable-svg/${LANG_TAG[l]}/${nm}.svg`,await exportSvg(j,p,l))}catch(e){}}
      const row=[p.n,p.date,p.platform,p.format,p.pillar,p.status];for(const l of langs){const L=p[l]||{};row.push(L.headline,L.subline,L.caption,(L.hashtags||[]).join(" "),L.cta,L.altText)}row.push(p.plan?.imagePrompt||"");rows.push(row);
    }
    zip.file("captions.csv","﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\n"));
    if(j.analysis) zip.file("strategy.json",JSON.stringify(j.analysis,null,2));
    if(j.direction) zip.file("art-direction.json",JSON.stringify(j.direction,null,2));
    await saveFile(`${slug(clientOf(j)?.name)}-${slug(j.title)}.zip`,await zip.generateAsync({type:"blob"}));
  }catch(e){toast("Couldn't build the zip here. Download the posts one by one.")}
}
